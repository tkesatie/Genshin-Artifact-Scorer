# Rules config — ported 1:1 from the Artifact Rules sheet.
# Edit here if you ever want to retune thresholds; everything downstream
# (score.py) reads from this file, same as the sheet's VLOOKUPs did.

base_thresholds:
  # usage|role : {good, excellent, finished_excellent_count, luxury_excellent_count}
  "Active|DPS":       {good: 6, excellent: 7, finished_excellent: 3, luxury_excellent: 5}
  "Active|Sub-DPS":   {good: 5, excellent: 7, finished_excellent: 2, luxury_excellent: 4}
  "Active|Support":   {good: 3, excellent: 5, finished_excellent: 1, luxury_excellent: 3}
  "IT Only|DPS":      {good: 6, excellent: 7, finished_excellent: 2, luxury_excellent: 3}
  "IT Only|Sub-DPS":  {good: 5, excellent: 7, finished_excellent: 1, luxury_excellent: 2}
  "IT Only|Support":  {good: 3, excellent: 5, finished_excellent: 0, luxury_excellent: 1}

# Adjustment based on Effective Useful Stat Pool (main-stat-pool minus 1 if
# main stat == a listed useful stat for that slot). Approximate/bucketed match,
# same as the sheet's VLOOKUP(...,TRUE) — pick the highest stat_count <= pool.
stat_pool_adjustment:
  - {stat_count: 1, good_adj: -3, excellent_adj: -3}
  - {stat_count: 2, good_adj: -2, excellent_adj: -2}
  - {stat_count: 3, good_adj: -1, excellent_adj: -1}
  - {stat_count: 4, good_adj: 0,  excellent_adj: 0}
  - {stat_count: 5, good_adj: 0,  excellent_adj: 0}
  - {stat_count: 6, good_adj: 0,  excellent_adj: 0}

# Slot adjustment — Flower/Feather aren't constrained by a main-stat
# requirement (main is always fixed HP/ATK flat), so far more candidate
# artifacts exist for these slots than for Sands/Goblet/Circlet, where the
# wrong main stat disqualifies a piece outright. More candidates to choose
# from means you can afford to be pickier, hence the higher bar. This is a
# *selectivity* argument, not a roll-composition one - the roll-composition
# side (Flower/Feather not losing a useful-stat slot to main stat) is
# already handled by stat_pool_adjustment via effective_useful_pool, so
# don't fold that reasoning back in here or it double-counts.
slot_adjustment:
  Flower:  {good_adj: 1, excellent_adj: 1}
  Feather: {good_adj: 1, excellent_adj: 1}
  Sands:   {good_adj: 0, excellent_adj: 0}
  Goblet:  {good_adj: 0, excellent_adj: 0}
  Circlet: {good_adj: 0, excellent_adj: 0}

# Per-character overrides — blank in the sheet currently. Add entries here
# if a specific character ever needs a manually adjusted bar, e.g.:
# Furina: {good_adj: -1, excellent_adj: -1, notes: "cracked HP substat rolls are enough"}
character_overrides: {}

# Domain score weighting (from our latest formula)
domain_scoring:
  active_weight: 2.0
  it_only_weight: 0.7
  finished_polish_weight: 0.2   # applied to (luxury_excellent_count - excellent_pieces) for non-Luxury chars

flex_rules:
  min_ev_gain: 2.0

# Imaginarium Theater filter (see README's Imaginarium Theater Filter section).
# When enabled, scoring is narrowed to usage: Active characters plus
# usage: IT Only characters whose `element` appears in `elements` below.
# Filtered-out characters are excluded from character scoring, upgrade
# recommendations, flex recommendations, inventory matching, domain priority
# calculations, and progress snapshots for that run - score.py filters the
# roster once, before it's threaded into every downstream module, so nothing
# needs to re-check the filter itself.
#
# enabled: turn the filter on/off. When false (default), all roster
#   characters are analyzed normally, regardless of `elements`.
# elements: the currently active Imaginarium Theater elements, e.g.
#   ["Pyro", "Hydro", "Cryo"]. Ignored when enabled is false.
imaginarium_theater:
  enabled: false
  elements: ["Hydro", "Cryo", "Electro"]

# Run-to-run progress snapshot (see README Planned Features #1).
# min_interval_hours gates both the save AND the diff: if less than this
# much real time has passed since the last saved snapshot, this run leaves
# the snapshot file untouched and no progress diff is shown, so repeated
# testing/tweaking runs don't manufacture the appearance of progress every
# few minutes.
snapshot:
  path: "snapshot.json"
  min_interval_hours: 24

# Global optimizer settings for probability of being optimal
optimizer:
  num_sims: 1000
  in_set_pool_size: 10
  off_set_pool_size: 10
  apply_ceiling_filter: true
