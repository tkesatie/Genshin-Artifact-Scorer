# Roster config with base stats for damage simulation
# primary_stat: ATK | HP | DEF | EM
# base_atk/base_hp/base_def: character's base stat at level 90 (weapon not included)
# If unknown, set to 999 and correct later.
#
# evaluation_pipeline: explicit composable damage-calculation steps.
#   Each step mutates a shared context sequentially; see pipeline.py for the
#   registered evaluators (standard_damage, personal_damage, reaction_damage,
#   spread_reaction, saturate, maximize_scaled_value, apply_modifiers,
#   em_max, hp_max).
#
#   - standard_damage: primary_total * talent_multiplier
#   - personal_damage: crit rate/damage + dmg_bonus multipliers
#   - reaction_damage: vaporize/melt (amplifying), transformative, or lunar_crystallize (Nod-Krai Lunar Reaction)
#   - apply_modifiers: kit modifier blocks (mutates stats before later steps)
#   - em_max / hp_max: raw EM / primary_total as the score
#   - maximize_scaled_value: weighted sum of raw stats (buff-strength chars)
#   - saturate: cap a raw stat (e.g. Nilou HP cap)
#
# `primary_stat` is still required: config.py derives `scaling` from it when
# no explicit weighted `scaling` list is given, and stats_calculator uses it
# as the fallback for primary_total. `modifiers` remains the source data for
# the apply_modifiers step.

Skirk:
  usage: Active
  element: Cryo
  role: DPS
  set: Galleries
  domain: "Natlan 2"
  useful_stats: [CD, CR, "ATK%"]
  main_stats: {Sands: ["ATK%"], Goblet: ["CryoDMG%"], Circlet: [CD, CR]}
