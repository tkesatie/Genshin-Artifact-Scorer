# Average roll value per substat, used to convert a raw GOOD substat value
# into an estimated "roll count" (what you've been hand-eyeballing as
# Useful Roll Count in the sheet).
#
# 5-star values are averaged across the four possible per-roll tiers.
# 4-star values are estimated at ~90% of 5-star (4-star artifacts only have
# 3 roll tiers and a lower ceiling) — this is an approximation; if you want
# exact 4-star tables later we can add them, but this is close enough for
# ranking purposes, which is all the roll-count metric is used for.
#
# GOOD substat keys: hp, hp_, atk, atk_, def, def_, enerRech_, eleMas,
# critRate_, critDMG_   (trailing underscore = percent stat)

